[tool.poetry]
name = "local-rag-ollama"
version = "0.1.0"
description = "Fully local RAG: ingest Markdown/PDF/HTML/text, hybrid BM25 + vector retrieval with RRF and an optional cross-encoder reranker, cited answers from open-weight models on ollama, a web UI and a benchmark. Documents never leave the machine."
authors = ["Martín Castro Álvarez <martincastro.10.5@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/MartinCastroAlvarez/local-rag-ollama"
repository = "https://github.com/MartinCastroAlvarez/local-rag-ollama"
documentation = "https://github.com/MartinCastroAlvarez/local-rag-ollama#readme"
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "ollama",
    "local-llm",
    "hybrid-search",
    "bm25",
    "sqlite-vec",
    "embeddings",
    "reranking",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
packages = [{ include = "local_rag" }]
include = [
    { path = "LICENSE", format = ["sdist", "wheel"] },
]

[tool.poetry.scripts]
local-rag = "local_rag.cli:main"

[tool.poetry.dependencies]
python = "^3.11"
httpx = ">=0.27,<1"
pypdf = ">=6.1,<7"
sqlite-vec = ">=0.1.6,<0.2"
fastapi = ">=0.115,<1"
uvicorn = ">=0.30,<1"
fastembed = { version = ">=0.7,<1", optional = true }

[tool.poetry.extras]
fastembed = ["fastembed"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-cov = ">=5,<8"
ruff = ">=0.6"
mypy = "^1.11 || ^2.0"
bandit = "^1.7"
pip-audit = "^2.7"
httpx2 = ">=2.16,<3"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------- #
# Ruff - lint + format
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # bugbear
    "S",            # bandit-style security
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RET",          # returns
    "PIE",          # misc
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "S101", "S104", "S105", "S106", "S108", "S311", "E501"]
"examples/**/*.py" = ["S101"]
# Maintainer-only script: runs headless Chrome with a fixed argv to print the bundled PDF.
"scripts/**/*.py" = ["S603", "S404", "E501"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["local_rag", "tests", "examples"]

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=local_rag",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
filterwarnings = ["error"]

# --------------------------------------------------------------------------- #
# MyPy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["sqlite_vec", "fastembed", "fastembed.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# Coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
source = ["local_rag"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
omit = [
    "local_rag/__main__.py",
]

# --------------------------------------------------------------------------- #
# Bandit
# --------------------------------------------------------------------------- #
[tool.bandit]
exclude_dirs = ["tests", "examples", "scripts", ".venv", "build", "dist"]
